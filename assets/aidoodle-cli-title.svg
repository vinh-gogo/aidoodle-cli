<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Radial Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="28%" stop-color="#60a5fa"/>
      <stop offset="55%" stop-color="#c084fc"/>
      <stop offset="80%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="tagBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="30" cy="0" r="1" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background Base Container -->
  <rect x="2" y="2" width="956" height="226" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Background Glow & Grid Overlay -->
  <rect x="3" y="3" width="954" height="224" rx="15" fill="url(#cyanGlow)"/>
  <rect x="3" y="3" width="954" height="224" rx="15" fill="url(#purpleGlow)"/>
  <rect x="3" y="3" width="954" height="224" rx="15" fill="url(#amberGlow)"/>
  <rect x="3" y="3" width="954" height="224" rx="15" fill="url(#techGrid)"/>

  <!-- Decorative Corner Accents (Cyberpunk / Terminal Style) -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 944 32 L 944 16 L 928 16" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
  <path d="M 16 198 L 16 214 L 32 214" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 944 198 L 944 214 L 928 214" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>

  <!-- Top Right Terminal Dot Status -->
  <g transform="translate(875, 20)">
    <circle cx="10" cy="10" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="26" cy="10" r="4" fill="#f59e0b" opacity="0.8"/>
    <circle cx="42" cy="10" r="4" fill="#10b981" opacity="0.8"/>
  </g>

  <!-- Left Icon / Avatar Badge (Doodle Stick-figure + AI Sparkle) -->
  <g transform="translate(42, 38)">
    <!-- Badge Background with Glow -->
    <rect x="0" y="0" width="82" height="82" rx="18" fill="url(#badgeGrad)" opacity="0.15"/>
    <rect x="0" y="0" width="82" height="82" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.8"/>

    <!-- Terminal Prompt Symbol `>_` -->
    <text x="14" y="24" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="800" fill="#38bdf8">&gt;_</text>

    <!-- Doodle Creator Figure (Stone Age / Stick-man with Digital Stylus) -->
    <!-- Head -->
    <circle cx="41" cy="35" r="10" fill="none" stroke="#f8fafc" stroke-width="2.5"/>
    <!-- Headband / Feather (Prehistoric Doodle vibe) -->
    <path d="M 39 25 L 43 17 L 46 25" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <!-- Smile & Eye Dots -->
    <circle cx="38" cy="34" r="1.2" fill="#38bdf8"/>
    <circle cx="44" cy="34" r="1.2" fill="#38bdf8"/>
    <path d="M 38 38 Q 41 41 44 38" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Spine -->
    <path d="M 41 45 L 41 62" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left Hand raising Digital Pen / Quill -->
    <path d="M 41 51 L 27 46 L 24 37" fill="none" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Right Hand with Magic Stylus -->
    <path d="M 41 51 L 56 46 L 66 38" fill="none" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Glowing Stylus Tip / AI Star Sparkle -->
    <circle cx="67" cy="37" r="3" fill="#f43f5e" filter="url(#glowFilter)"/>
    <path d="M 67 31 L 67 43 M 61 37 L 73 37" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M 41 62 L 31 75" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 41 62 L 51 75" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Small Sparkles -->
    <path d="M 12 55 L 14 59 L 18 61 L 14 63 L 12 67 L 10 63 L 6 61 L 10 59 Z" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Main Title Area -->
  <g transform="translate(144, 40)">
    <!-- Version Tag Pill -->
    <rect x="0" y="0" width="84" height="22" rx="11" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <text x="42" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">v1.0.0 CLI</text>

    <!-- Architecture Pill -->
    <rect x="92" y="0" width="168" height="22" rx="11" fill="#7c3aed" fill-opacity="0.2" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
    <text x="176" y="15" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#c084fc">⚡ Deterministic Engine</text>

    <!-- Web Studio Pill -->
    <rect x="268" y="0" width="144" height="22" rx="11" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
    <text x="340" y="15" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">🖥️ Web Studio TUI</text>

    <!-- Main Title "aidoodle-cli" -->
    <text x="0" y="74" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5" fill="url(#titleGrad)">
      aidoodle-cli
    </text>

    <!-- Vietnamese Subtitle -->
    <text x="2" y="105" font-family="'Segoe UI', system-ui, sans-serif" font-size="16.5" font-weight="600" fill="#e2e8f0" letter-spacing="0.2">
      Hệ Thống AI Đa Chế Độ &amp; Xưởng Sáng Tác Tự Động Hóa
    </text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="42" y1="162" x2="918" y2="162" stroke="#334155" stroke-opacity="0.6" stroke-width="1"/>
  <line x1="144" y1="162" x2="380" y2="162" stroke="url(#titleGrad)" stroke-width="2"/>

  <!-- Bottom Badges / 4 Specialized Modes -->
  <g transform="translate(42, 176)">
    <!-- Mode 1: Doodle Explainer -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="176" height="34" rx="8" fill="url(#tagBg)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
      <text x="88" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fde68a">🦴 Doodle Explainer (5m+)</text>
    </g>

    <!-- Mode 2: Tâm lý học hành vi -->
    <g transform="translate(186, 0)">
      <rect x="0" y="0" width="176" height="34" rx="8" fill="url(#tagBg)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="88" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">🧠 Tâm Lý Học Hành Vi</text>
    </g>

    <!-- Mode 3: Lịch sử Việt Nam -->
    <g transform="translate(372, 0)">
      <rect x="0" y="0" width="176" height="34" rx="8" fill="url(#tagBg)" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1"/>
      <text x="88" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#fecdd3">⚔️ Sử Thi Lịch Sử VN</text>
    </g>

    <!-- Mode 4: Tiểu thuyết / Manga -->
    <g transform="translate(558, 0)">
      <rect x="0" y="0" width="176" height="34" rx="8" fill="url(#tagBg)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="88" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#bae6fd">📖 Tiểu Thuyết / Manga</text>
    </g>

    <!-- Export Word & Video Package -->
    <g transform="translate(744, 0)">
      <rect x="0" y="0" width="132" height="34" rx="8" fill="url(#tagBg)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="66" y="21" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#6ee7b7">📄 Word &amp; Video</text>
    </g>
  </g>
</svg>
