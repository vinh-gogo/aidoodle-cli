name: Build & Package Windows (ainovel-cli)

on:
  push:
    branches:
      - doodle-explainer
      - main
      - history-vietnam
    tags:
      - 'v*'
  pull_request:
    branches:
      - doodle-explainer
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows AMD64 Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.0'
          check-latest: true
          cache: true

      - name: Print Go version
        run: go version

      - name: Prepare metadata
        id: meta
        shell: pwsh
        run: |
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $commit = $env:GITHUB_SHA.Substring(0, 7)
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF.Replace("refs/tags/", "") } else { "dev-$commit" }
          "DATE=$date" >> $env:GITHUB_ENV
          "COMMIT=$commit" >> $env:GITHUB_ENV
          "VERSION=$tag" >> $env:GITHUB_ENV
          Write-Host "Version: $tag, Commit: $commit, Date: $date"

      - name: Build executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package" | Out-Null
          $ldflags = "-s -w -X 'main.version=${{ env.VERSION }}' -X 'main.commit=${{ env.COMMIT }}' -X 'main.date=${{ env.DATE }}'"
          go build -trimpath -ldflags $ldflags -o package/ainovel-cli.exe ./cmd/ainovel-cli
          if (!(Test-Path "package/ainovel-cli.exe")) {
              throw "Build failed: package/ainovel-cli.exe not found"
          }
          Write-Host "Binary built successfully. Size: $((Get-Item package/ainovel-cli.exe).Length / 1MB) MB"

      - name: Assemble Windows Portable Package
        shell: pwsh
        run: |
          # Tao file bat khoi chay tien loi cho nguoi dung Windows
          $launcherContent = @'
          @echo off
          title AI Novel CLI - Sang tac AI Da Che Do
          chcp 65001 >nul
          cd /d "%~dp0"
          cls
          echo ======================================================================
          echo   AI NOVEL CLI - He thong AI Sang tac Da Che Do (Windows Portable)
          echo ======================================================================
          echo.
          echo [*] Dang khoi dong giao dien dong lenh TUI...
          echo [*] Huong dan nhanh:
          echo     - Go /mode de chon 1 trong 4 che do (Tieu thuyet, Video Que, Tam ly, Lich su)
          echo     - Go /dash de mo Dashboard quan ly cac tac pham da viet
          echo     - Go /new  de bat dau tac pham moi tinh
          echo.
          ainovel-cli.exe
          if %ERRORLEVEL% NEQ 0 (
              echo.
              echo [!] Chuong trinh da dung lai hoac co thong bao thoat.
              pause
          )
          '@
          Set-Content -Path "package/Chay-AiNovel.bat" -Value $launcherContent -Encoding UTF8

          # Sao chep cac tai lieu huong dan
          if (Test-Path "README.md") { Copy-Item "README.md" "package/" }
          if (Test-Path "GUIDE.md") { Copy-Item "GUIDE.md" "package/" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "package/" }
          if (Test-Path "config.example.jsonc") { Copy-Item "config.example.jsonc" "package/" }

          # Nen thu muc thanh file zip
          $zipName = "ainovel-cli-windows-amd64.zip"
          Compress-Archive -Path "package/*" -DestinationPath $zipName -Force

          # Tao ma bam SHA256 checksum
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding ASCII

          Write-Host "Package created: $zipName"
          Write-Host "SHA256: $hash"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ainovel-cli-windows-amd64
          path: |
            ainovel-cli-windows-amd64.zip
            ainovel-cli-windows-amd64.zip.sha256
          retention-days: 30

      - name: Publish GitHub Release (When Tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ainovel-cli-windows-amd64.zip
            ainovel-cli-windows-amd64.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
